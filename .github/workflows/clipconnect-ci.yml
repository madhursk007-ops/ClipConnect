name: ClipConnect integration checks

on:
  push:
    branches:
      - master
      - integration/full-marketplace
    paths:
      - 'backend/**'
      - 'frontend-react/**'
      - '.github/workflows/clipconnect-ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'frontend-react/**'
      - '.github/workflows/clipconnect-ci.yml'

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend-react
      - name: Build React application
        run: npm run build
        working-directory: frontend-react

  backend-validation:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://clipconnect:clipconnect@localhost:5432/clipconnect?schema=public
      JWT_SECRET: ci-only-secret-change-before-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-change-before-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Validate Prisma schema
        run: npx prisma validate
        working-directory: backend
      - name: Run backend tests
        run: npm test -- --passWithNoTests
        working-directory: backend
