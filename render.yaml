services:
  - type: web
    name: clipconnect
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend-react && npm run build --prefix frontend-react && npm run db:generate --prefix backend && npm run db:migrate:prod --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: clipconnect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 7d

databases:
  - name: clipconnect-db
    databaseName: clipconnect
    user: clipconnect
    plan: free
